spring:
  datasource:
    url: jdbc:h2:mem:eduquest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          connectiontimeout: 500
          timeout: 500
          writetimeout: 500

jwt:
  secret: TestSecretKeyWithMoreThan64CharactersJustToMakeSureltWorks123
  expiration-access: 3600000
  expiration-refresh: 604800000

openai:
  api:
    key: test-key
    url: https://api.openai.com/v1/chat/completions