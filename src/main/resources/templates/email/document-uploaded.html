<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f8; color: #1f2937; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 24px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .header { background-color: #4f46e5; color: #ffffff; padding: 24px; }
        .header h1 { margin: 0; font-size: 22px; }
        .body { padding: 24px; line-height: 1.6; }
        .footer { padding: 16px 24px; font-size: 12px; color: #6b7280; background-color: #f9fafb; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>EduQuest</h1>
    </div>
    <div class="body">
        <h2>Documento publicado</h2>
        <p>Tu documento <strong th:text="${documentTitle}">Apuntes</strong> fue subido correctamente al repositorio de EduQuest.</p>
        <p>Ya está disponible para toda la comunidad de estudio.</p>
    </div>
    <div class="footer">
        <p>Equipo EduQuest - Plataforma educativa</p>
    </div>
</div>
</body>
</html>
