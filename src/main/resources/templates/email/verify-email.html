<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f8; color: #1f2937; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 24px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .header { background-color: #4f46e5; color: #ffffff; padding: 24px; }
        .header h1 { margin: 0; font-size: 22px; }
        .body { padding: 24px; line-height: 1.6; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center; background-color: #eef2ff; color: #3730a3; padding: 16px; border-radius: 8px; margin: 16px 0; }
        .button { display: inline-block; background-color: #4f46e5; color: #ffffff !important; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; }
        .footer { padding: 16px 24px; font-size: 12px; color: #6b7280; background-color: #f9fafb; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>EduQuest</h1>
    </div>
    <div class="body">
        <h2>Hola, <span th:text="${username}">usuario</span></h2>
        <p>Gracias por unirte a EduQuest. Para confirmar que este correo es tuyo, ingresa este código en la web o en la app:</p>
        <div class="code" th:text="${code}">000000</div>
        <p>El código vence en 30 minutos. Si no creaste una cuenta, ignora este correo.</p>
    </div>
    <div class="footer">
        <p>Equipo EduQuest - Plataforma educativa</p>
    </div>
</div>
</body>
</html>
